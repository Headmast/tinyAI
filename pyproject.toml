[project]
name = "tinyai"
version = "0.26.0"
description = "Учебный AI-проект: от базового промптинга до MCP-интеграции и мульти-агентного оркестратора"
requires-python = ">=3.9"
dependencies = [
    "openai>=2.29.0",
    "python-dotenv==1.0.1",
    "tiktoken>=0.7.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = [
    "core",
    "news_agent",
    "journalist_agent",
    "memory_agent",
    "rag",
    "pipeline",
    "pipeline.servers",
    "scheduler",
    "mcp_package",
    "mcp_package.pipeline",
    "mcp_package.scheduler",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "news_agent", "journalist_agent", "memory_agent",
    "rag", "pipeline", "scheduler", "mcp_package",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: чистые юнит-тесты без внешних зависимостей",
    "integration: тесты с реальными файловыми операциями",
    "api: тесты, требующие реального API-ключа",
    "e2e: end-to-end тесты",
    "slow: медленные тесты (> 5 секунд)",
]
